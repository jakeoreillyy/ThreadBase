services:
  api:
    image: jakeoreilly/threadbase
    depends_on:
      - postgres
    ports:
      - "80:8000"
    env_file:
      - ./.env.docker

  postgres:
    image: postgres:16
    env_file:
      - ./.env.docker
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
